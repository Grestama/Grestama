
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Grestama
          outputs: |
            dist/github-snake.svg?color_snake=%2338BDF8&color_dots=%230B1224,%231E3A8A,%230E7490,%2306B6D4,%237DD3FC
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8

      - name: Publish snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
